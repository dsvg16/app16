services:
  server:
    build:
      context: server
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-5000}:5000"
    volumes:
      - user-files:/app/storage
      # provide these on the host before "up": keys/ (server + client .asc)
      # and Group_16.pdf. without keys rmap stays off (503); without the pdf get-link is 503.
      - ./keys:/app/keys:ro
      - ./Group_16.pdf:/app/source/Group_16.pdf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - PYTHONUNBUFFERED=1
      - HOME=/tmp
      # DB connection details for future use by the API
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=tatou
      - DB_USER=${MARIADB_USER}
      - DB_PASSWORD=${MARIADB_PASSWORD}
      - FLAG_2=${FLAG_2}
      - SECRET_KEY=${SECRET_KEY}
      - STORAGE_DIR=/app/storage
      # RMAP: key paths are inside the read-only /app/keys mount
      - RMAP_SERVER_PUB=/app/keys/server_pub.asc
      - RMAP_SERVER_PRIV=/app/keys/server_priv.asc
      - RMAP_CLIENT_KEYS_DIR=/app/keys/clients
      - RMAP_KEY_PASSPHRASE=${RMAP_KEY_PASSPHRASE:-}
      - RMAP_WM_KEY=${RMAP_WM_KEY:-}
      - RMAP_SOURCE_PDF=/app/source/Group_16.pdf
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=tatou
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/tatou.sql:/docker-entrypoint-initdb.d/10-tatou.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root --password=$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
  user-files:
