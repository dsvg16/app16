name: Tatou DevSecOps Pipeline

on:
  push:
    branches: [ "main", "irsad" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  #Secret scanning + SAST
  security-scan:
    name: Security & SAST Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency Vulnerability Audit (SCA)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement server/pyproject.toml || true

      - name: Bandit Security Linter
        run: |
          pip install bandit
          bandit -r server/src -ll -i || true

      - name: Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: server/Dockerfile
          ignore: DL3008,DL3013

  #Build + Test
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    needs: security-scan
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root
          MARIADB_DATABASE: tatou
          MARIADB_USER: tatou
          MARIADB_PASSWORD: ci-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root --password=ci-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./server[dev]"

      - name: Load Database Schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          mariadb -h 127.0.0.1 -P 3306 -u root --password=ci-root < db/tatou.sql

      # TATOU_DB_TEST makes the full RMAP handshake tests run instead of skip.
      - name: Execute Tests
        env:
          TATOU_DB_TEST: "1"
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: tatou
          DB_PASSWORD: ci-pass
          DB_NAME: tatou
        run: |
          pytest server/test \
            --cov=server/src --cov-branch \
            --cov-report=term-missing --cov-fail-under=50

  container-scan:
    name: Build & Scan Container Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t tatou-server:scan server/

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tatou-server:scan'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
